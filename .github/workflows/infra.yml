name: Infra

# OpenTofu: plan on every pull request, apply on merge to main.
# - infra/iam/ (the roles CI uses) is applied first, by the tofu-iam role, so new permissions exist
#   before the site needs them. That role can only manage roles under a fixed permissions boundary.
# - infra/ (the site stack) is applied next, by the tofu-apply role.
# - infra/bootstrap/ (OIDC provider, boundary, tofu-iam role) is applied from a laptop; CI only validates it.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read

# Pull requests: one plan per PR; a newer push cancels the older plan.
# main: one run at a time and never cancelled mid-run, so a run's IAM and site applies both finish
# before the next run starts. A newer queued run replaces an older queued one; it applies the newer tip.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('infra-plan-{0}', github.event.pull_request.number) || format('infra-apply-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TOFU_VERSION: "1.13.1"
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  plan:
    # Required status check. Runs on every PR so it always reports; without infra changes it
    # passes in seconds and never requests cloud credentials.
    name: Terraform plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the PR merge commit and its base parent
          persist-credentials: false

      # code:  OpenTofu files changed (needs a plan).
      # check: code or this workflow changed (format and validate, no credentials needed).
      # trusted: a branch of this repo opened by a person. Fork and Dependabot runs get no
      #   Actions secrets (forks get no OIDC token either), so they are never allowed to plan.
      - name: Detect infra changes
        id: changes
        working-directory: .
        env:
          TRUSTED: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        run: |
          code=false; check=false
          if git diff --name-only HEAD^1 HEAD -- infra | grep -q .; then code=true; check=true; fi
          if git diff --name-only HEAD^1 HEAD -- .github/workflows/infra.yml | grep -q .; then check=true; fi
          plan=false
          if [ "$check" = true ] && [ "$TRUSTED" = true ]; then plan=true; fi
          { echo "code=$code"; echo "check=$check"; echo "plan=$plan"; } >> "$GITHUB_OUTPUT"
          if [ "$check" = false ]; then
            echo "No infra changes in this pull request; nothing to plan." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$plan" = false ]; then
            echo "Untrusted run (fork or Dependabot): format and validate only, no plan." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: steps.changes.outputs.check == 'true'
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Format check
        if: steps.changes.outputs.check == 'true'
        run: tofu fmt -check -recursive -diff

      - name: Validate infra/bootstrap (applied from a laptop, not planned here)
        if: steps.changes.outputs.check == 'true'
        working-directory: infra/bootstrap
        run: |
          tofu init -backend=false
          tofu validate

      - name: Validate infra/iam
        if: steps.changes.outputs.check == 'true'
        working-directory: infra/iam
        run: |
          tofu init -backend=false
          tofu validate

      - name: Validate infra
        if: steps.changes.outputs.check == 'true'
        run: |
          tofu init -backend=false
          tofu validate

      # An untrusted run may bump actions in this workflow, but must not change OpenTofu code
      # without a plan. Push the branch to this repository to get one.
      - name: Refuse unplanned infra changes
        if: steps.changes.outputs.code == 'true' && steps.changes.outputs.plan == 'false'
        run: |
          echo "::error::This PR changes infra/ but runs without cloud credentials (fork or Dependabot), so it cannot be planned. Push the branch to this repository to get a plan."
          exit 1

      - name: Assume the read-only plan role
        if: steps.changes.outputs.plan == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TOFU_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      # Read-only role: it cannot write lock files, and a plan never writes state.
      - name: Plan infra/iam
        if: steps.changes.outputs.plan == 'true'
        working-directory: infra/iam
        run: |
          tofu init -reconfigure -backend-config=../backend.hcl
          tofu plan -lock=false -out=tfplan
          {
            echo '### OpenTofu plan for infra/iam'
            echo '```'
            tofu show -no-color tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Plan infra
        if: steps.changes.outputs.plan == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PLAN }}
        run: |
          tofu init -reconfigure -backend-config=backend.hcl
          tofu plan -lock=false -out=tfplan
          {
            echo '### OpenTofu plan for infra/'
            echo '```'
            tofu show -no-color tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply-iam:
    name: Terraform apply (IAM)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: infra-iam # deployments limited to main, no admin bypass; holds no secrets
    permissions:
      contents: read
      id-token: write
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    defaults:
      run:
        working-directory: infra/iam
    steps:
      # Always apply the current tip of main, not the commit that triggered the run: a re-run of
      # an older run (re-runs keep their original SHA) must not roll infrastructure back.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0 # full history so the push range below can be diffed
          persist-credentials: false

      # The site job applies only this revision's infra/ code.
      - name: Record the revision
        id: revision
        working-directory: .
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Warn when infra/bootstrap changed
        if: github.event_name == 'push'
        working-directory: .
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # All zeros when the branch is created; nothing to compare against.
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            exit 0
          fi
          if git diff --name-only "$BEFORE" HEAD -- infra/bootstrap | grep -q .; then
            echo "::warning title=infra/bootstrap changed::CI does not apply infra/bootstrap. Run 'tofu apply' in infra/bootstrap from a laptop with admin credentials."
          fi

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Assume the IAM apply role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TOFU_IAM_ROLE_ARN }}
          aws-region: us-east-1

      - name: Init
        run: tofu init -backend-config=../backend.hcl

      - name: Plan
        run: |
          tofu plan -out=tfplan
          {
            echo '### OpenTofu plan applied to infra/iam'
            echo '```'
            tofu show -no-color tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        run: tofu apply tfplan

  apply:
    name: Terraform apply
    needs: apply-iam # permissions first
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45 # a new ACM validation or CloudFront update can take a while
    environment: infra # deployments limited to main; holds the Cloudflare apply token
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0 # history to compare with the revision the IAM job applied
          persist-credentials: false

      # Apply the site only if its code is what the IAM job just applied. infra/ differs when a merge
      # landed during this run (that merge's own run applies both stacks next) or when only this job
      # is re-run later; applying it then could use permissions that don't exist yet, or roll back.
      - name: Check that IAM was applied for this revision
        working-directory: .
        env:
          IAM_SHA: ${{ needs.apply-iam.outputs.sha }}
        run: |
          if ! git diff --quiet "$IAM_SHA" HEAD -- infra; then
            echo "::error title=infra/ changed after the IAM apply::main has newer infra/ code than the IAM job applied ($IAM_SHA). The run for the newer commit applies both stacks; to retry this run, use Re-run all jobs."
            exit 1
          fi

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Assume the apply role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TOFU_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Init
        run: tofu init -backend-config=backend.hcl

      - name: Plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          tofu plan -out=tfplan
          {
            echo '### OpenTofu plan applied to infra/'
            echo '```'
            tofu show -no-color tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: tofu apply tfplan
